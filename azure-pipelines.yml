trigger:
  branches:
    include:
      - main

pool:
  name: 'migration'   # your self-hosted pool

variables:

  - group: mumbai_azure
  
  - name: AWS_REGION
    value: 'ap-south-1'

  - name: LAMBDA_FUNCTION_NAME
    value: 'myLambda'

  - name: JAR_FILE
    value: 'jb-hello-world-0.1.0.jar'

  - name: S3_BUCKET
    value: 'sachin-s3-lambda-bucket111'

  - name: S3_KEY
    value: 'lambda-builds/jb-hello-world-0.1.0.jar'

  - name: AWS_SERVICE_CONNECTION
    value: 'S3_Lmabda'  # Replace with your actual service connection name

stages:
- stage: Build
  displayName: 'Build (Gradle)'
  jobs:
  - job: BuildJob
    displayName: 'Gradle Build'
    steps:
    - script: |
        echo "Java version:"
        java -version || true
        echo "Gradle (wrapper) version:"
        ./gradlew -v || (echo "Gradle wrapper missing or not executable"; exit 1)
      displayName: 'Verify build tools'

    - script: |
        chmod +x gradlew
        ./gradlew clean build
      displayName: 'Gradle: clean build'

    - script: |
        echo "Listing produced jar (if present):"
        ls -lah $(System.DefaultWorkingDirectory)/$(JAR_FILE) || true
      displayName: 'List build artifacts'

    - publish: $(System.DefaultWorkingDirectory)/build/libs
      artifact: drop
      displayName: 'Publish build artifacts'

- stage: UploadToS3
  displayName: 'Upload artifact to S3'
  dependsOn: Build
  jobs:
  - job: UploadJob
    displayName: 'S3 Upload'
    steps:
    - download: current
      artifact: drop

    - script: |
        echo ">>> Debug: check jar"
        echo "Pipeline.Workspace: $(Pipeline.Workspace)"
        ls -lah $(Pipeline.Workspace)/drop/$(JAR_FILE) || true
      displayName: 'Debug: check downloaded artifact'

    - task: AWSCLI@1
      displayName: 'Test S3 connectivity'
      inputs:
        awsCredentials: '$(AWS_SERVICE_CONNECTION)'
        regionName: '$(AWS_REGION)'
        awsCommand: 's3'
        awsSubCommand: 'ls'
        awsArguments: 's3://$(S3_BUCKET)'

    - task: AWSCLI@1
      displayName: 'Upload JAR to S3'
      inputs:
        awsCredentials: '$(AWS_SERVICE_CONNECTION)'
        regionName: '$(AWS_REGION)'
        awsCommand: 's3'
        awsSubCommand: 'cp'
        awsArguments: '$(Pipeline.Workspace)/drop/$(JAR_FILE) s3://$(S3_BUCKET)/$(S3_KEY) --no-progress'

- stage: DeployLambda
  displayName: 'Deploy to AWS Lambda'
  dependsOn: UploadToS3
  jobs:
  - job: DeployJob
    displayName: 'Update Lambda'
    steps:
    - task: AWSCLI@1
      displayName: 'Update Lambda function code'
      inputs:
        awsCredentials: '$(AWS_SERVICE_CONNECTION)'
        regionName: '$(AWS_REGION)'
        awsCommand: 'lambda'
        awsSubCommand: 'update-function-code'
        awsArguments: '--function-name $(LAMBDA_FUNCTION_NAME) --s3-bucket $(S3_BUCKET) --s3-key $(S3_KEY)'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

    - task: AWSCLI@1
      displayName: 'Verify Lambda function'
      inputs:
        awsCredentials: '$(AWS_SERVICE_CONNECTION)'
        regionName: '$(AWS_REGION)'
        awsCommand: 'lambda'
        awsSubCommand: 'get-function'
        awsArguments: '--function-name $(LAMBDA_FUNCTION_NAME)'