trigger:
  branches:
    include:
      - main

pool:
  name: 'migration'   # your self-hosted pool

variables:
  - group: mumbai_azure   # <-- variable group with AWS creds

  - name: AWS_REGION
    value: 'ap-south-1'

  - name: LAMBDA_FUNCTION_NAME
    value: 'myLambda'

  - name: JAR_FILE
    value: 'build/libs/jb-hello-world-0.1.0.jar'

  - name: S3_BUCKET
    value: 'sachin-s3-lambda-bucket111'

  - name: S3_KEY
    value: 'lambda-builds/jb-hello-world-0.1.0.jar'

stages:
- stage: Build
  displayName: 'Build (Gradle)'
  jobs:
  - job: BuildJob
    displayName: 'Gradle Build'
    steps:
    - script: |
        echo "Java version:"
        java -version || true
        echo "Gradle (wrapper) version:"
        ./gradlew -v || (echo "Gradle wrapper missing or not executable"; exit 1)
      displayName: 'Verify build tools'

    - script: |
        chmod +x gradlew
        ./gradlew clean build
      displayName: 'Gradle: clean build'

    - script: |
        echo "Listing produced jar (if present):"
        ls -lah $(System.DefaultWorkingDirectory)/$(JAR_FILE) || true
      displayName: 'List build artifacts'

    - publish: $(System.DefaultWorkingDirectory)/build/libs
      artifact: drop
      displayName: 'Publish build artifacts'

- stage: UploadToS3
  displayName: 'Upload artifact to S3'
  dependsOn: Build
  jobs:
  - job: UploadJob
    displayName: 'S3 Upload'
    steps:
    - download: current
      artifact: drop

    - script: |
        echo ">>> Ensure aws CLI installed"
        if command -v aws >/dev/null 2>&1; then
          echo "aws found: $(aws --version)"
        else
          echo "Installing AWS CLI v2..."
          if ! command -v unzip >/dev/null 2>&1; then
            echo "Installing unzip..."
            sudo apt-get update -y || true
            sudo apt-get install -y unzip || true
          fi
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -o awscliv2.zip
          sudo ./aws/install || (echo "aws install failed"; exit 1)
          aws --version
        fi
      displayName: 'Install / verify aws cli'

    - script: |
        echo ">>> Debug: check jar"
        echo "Pipeline.Workspace: $(Pipeline.Workspace)"
        ls -lah $(Pipeline.Workspace)/drop/$(JAR_FILE) || true
      displayName: 'Debug: check downloaded artifact'

    - script: |
        echo ">>> Test AWS connectivity (s3 ls)"
        aws s3 ls "s3://$(S3_BUCKET)" --region $(AWS_REGION)
      displayName: 'Test S3 connectivity (direct aws)'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)

    - script: |
        echo ">>> Upload jar to s3 (no progress)"
        aws s3 cp "$(Pipeline.Workspace)/drop/$(JAR_FILE)" "s3://$(S3_BUCKET)/$(S3_KEY)" --no-progress --region $(AWS_REGION)
      displayName: 'Upload JAR to S3 (direct aws)'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)

- stage: DeployLambda
  displayName: 'Deploy to AWS Lambda'
  dependsOn: UploadToS3
  jobs:
  - job: DeployJob
    displayName: 'Update Lambda'
    steps:
    - script: |
        echo ">>> Update Lambda from S3"
        aws lambda update-function-code \
          --function-name "$(LAMBDA_FUNCTION_NAME)" \
          --s3-bucket "$(S3_BUCKET)" \
          --s3-key "$(S3_KEY)" \
          --region $(AWS_REGION)
      displayName: 'Update Lambda (direct aws)'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)

    - script: |
        echo ">>> Verify Lambda (get-function)"
        aws lambda get-function \
          --function-name "$(LAMBDA_FUNCTION_NAME)" \
          --region $(AWS_REGION)
      displayName: 'Verify Lambda (direct aws)'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)
