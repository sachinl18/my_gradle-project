trigger:
  branches:
    include:
      - main

pool:
  name: 'migration'   # your self-hosted pool

variables:
  AWS_REGION: 'ap-south-1'
  LAMBDA_FUNCTION_NAME: 'myLambda'
  JAR_FILE: 'build/libs/jb-hello-world-0.1.0.jar'
  S3_BUCKET: 'sachin-s3-lambda-bucket111'
  S3_KEY: 'lambda-builds/jb-hello-world-0.1.0.jar'
  AWS_SERVICE_CONNECTION: 'S3_Lmabda'   # change if your service connection name differs

stages:
- stage: Build
  displayName: 'Build (Gradle)'
  jobs:
  - job: BuildJob
    displayName: 'Gradle Build'
    steps:
    - script: |
        echo "Java version:"
        java -version || true
        echo "Gradle (wrapper) version:"
        ./gradlew -v || (echo "Gradle wrapper missing or not executable"; exit 1)
      displayName: 'Verify build tools'

    - script: |
        chmod +x gradlew
        ./gradlew clean build
      displayName: 'Gradle: clean build'

    - script: |
        echo "Listing produced jar (if present):"
        ls -lah $(System.DefaultWorkingDirectory)/$(JAR_FILE) || true
      displayName: 'List build artifacts'

    - publish: $(System.DefaultWorkingDirectory)/build/libs
      artifact: drop
      displayName: 'Publish build artifacts'

- stage: UploadToS3
  displayName: 'Upload artifact to S3'
  dependsOn: Build
  jobs:
  - job: UploadJob
    displayName: 'S3 Upload'
    steps:
    - download: current
      artifact: drop

    # Install aws cli if missing (idempotent)
    - script: |
        echo ">>> Check for aws CLI"
        if command -v aws >/dev/null 2>&1; then
          echo "aws found: $(aws --version)"
        else
          echo "aws not found — installing AWS CLI v2"
          if ! command -v unzip >/dev/null 2>&1; then
            echo "unzip not present — installing unzip (may require sudo)"
            sudo apt-get update -y || true
            sudo apt-get install -y unzip || true
          fi
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -o awscliv2.zip
          sudo ./aws/install || (echo "install failed"; exit 1)
          echo "installed: $(aws --version)"
        fi
      displayName: 'Ensure AWS CLI installed'

    - script: |
        echo ">>> Agent info"
        uname -a
        free -h || true
      displayName: 'Debug: agent info'

    - script: |
        echo ">>> Check downloaded artifact path"
        echo "Pipeline.Workspace: $(Pipeline.Workspace)"
        echo "Expect jar at: $(Pipeline.Workspace)/drop/$(JAR_FILE)"
        ls -lah $(Pipeline.Workspace)/drop/$(JAR_FILE) || true
        echo "Size (bytes):"
        stat -c%s $(Pipeline.Workspace)/drop/$(JAR_FILE) || true
      displayName: 'Debug: check downloaded artifact'

    # --- Use awsCommand form (Fix A) ---
    - task: AWSCLI@1
      displayName: 'Test AWS connectivity: list bucket'
      inputs:
        awsCredentials: '$(AWS_SERVICE_CONNECTION)'
        regionName: '$(AWS_REGION)'
        awsCommand: 's3 ls s3://$(S3_BUCKET)'

    - task: AWSCLI@1
      displayName: 'Upload JAR to S3 (--no-progress)'
      inputs:
        awsCredentials: '$(AWS_SERVICE_CONNECTION)'
        regionName: '$(AWS_REGION)'
        awsCommand: 's3 cp $(Pipeline.Workspace)/drop/$(JAR_FILE) s3://$(S3_BUCKET)/$(S3_KEY) --no-progress'

- stage: DeployLambda
  displayName: 'Deploy to AWS Lambda'
  dependsOn: UploadToS3
  jobs:
  - job: DeployJob
    displayName: 'Update Lambda'
    steps:
    - task: AWSCLI@1
      displayName: 'Update Lambda (from S3)'
      inputs:
        awsCredentials: '$(AWS_SERVICE_CONNECTION)'
        regionName: '$(AWS_REGION)'
        awsCommand: 'lambda update-function-code --function-name $(LAMBDA_FUNCTION_NAME) --s3-bucket $(S3_BUCKET) --s3-key $(S3_KEY)'

    - task: AWSCLI@1
      displayName: 'Verify Lambda (get-function)'
      inputs:
        awsCredentials: '$(AWS_SERVICE_CONNECTION)'
        regionName: '$(AWS_REGION)'
        awsCommand: 'lambda get-function --function-name $(LAMBDA_FUNCTION_NAME)'
