trigger:
  branches:
    include:
      - main

pool:
  name: 'migration'

variables:
  AWS_REGION: 'ap-south-1'
  LAMBDA_FUNCTION_NAME: 'myLambda'
  JAR_FILE: 'build/libs/jb-hello-world-0.1.0.jar'
  S3_BUCKET: 'sachin-s3-lambda-bucket111'
  S3_KEY: 'lambda-builds/jb-hello-world-0.1.0.jar'

stages:
- stage: Build
  displayName: 'Build (Gradle)'
  jobs:
  - job: BuildJob
    displayName: 'Gradle Build'
    steps:
    - script: |
        echo "Java version:"
        java -version || true
        echo "Gradle (wrapper) version:"
        ./gradlew -v || (echo "Gradle wrapper missing or not executable"; exit 1)
      displayName: 'Verify build tools'

    - script: |
        chmod +x gradlew
        ./gradlew clean build
      displayName: 'Gradle: clean build'

    - script: |
        echo "Listing produced jar (if present):"
        ls -lah $(System.DefaultWorkingDirectory)/$(JAR_FILE) || true
      displayName: 'List build artifacts'

    - publish: $(System.DefaultWorkingDirectory)/build/libs
      artifact: drop
      displayName: 'Publish build artifacts'

- stage: UploadToS3
  displayName: 'Upload artifact to S3'
  dependsOn: Build
  jobs:
  - job: UploadJob
    displayName: 'S3 Upload'
    steps:
    # Download the artifact published in the Build stage
    - download: current
      artifact: drop

    - script: |
        echo "Pipeline.Workspace: $(Pipeline.Workspace)"
        echo "Checking downloaded artifact path: $(Pipeline.Workspace)/drop/$(JAR_FILE)"
        ls -lah $(Pipeline.Workspace)/drop/$(JAR_FILE) || true
      displayName: 'Debug: check downloaded artifact'

    - task: AWSCLI@1
      displayName: 'Upload JAR to S3'
      inputs:
        awsCredentials: 'S3_Lmabda'          # <-- your Azure DevOps service connection
        regionName: '$(AWS_REGION)'
        command: 's3'
        subCommand: 'cp'
        arguments: '$(Pipeline.Workspace)/drop/$(JAR_FILE) s3://$(S3_BUCKET)/$(S3_KEY)'

- stage: DeployLambda
  displayName: 'Deploy to AWS Lambda'
  dependsOn: UploadToS3
  jobs:
  - job: DeployJob
    displayName: 'Update Lambda'
    steps:
    - task: AWSCLI@1
      displayName: 'Update Lambda (from S3)'
      inputs:
        awsCredentials: 'S3_Lmabda'
        regionName: '$(AWS_REGION)'
        command: 'lambda'
        subCommand: 'update-function-code'
        arguments: '--function-name $(LAMBDA_FUNCTION_NAME) --s3-bucket $(S3_BUCKET) --s3-key $(S3_KEY)'

    - task: AWSCLI@1
      displayName: 'Verify Lambda (get-function)'
      inputs:
        awsCredentials: 'S3_Lmabda'
        regionName: '$(AWS_REGION)'
        command: 'lambda'
        subCommand: 'get-function'
        arguments: '--function-name $(LAMBDA_FUNCTION_NAME)'
